<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Games Zone | Premier Edition</title>
    <!-- Three.js for 3D Neural Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #9d50bb;
            --dark-bg: #05050a;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed; top: 0; left: 0; z-index: -1;
        }

        /* Glassmorphism Container */
        .main-hub {
            max-width: 1100px;
            margin: 50px auto;
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 8px;
        }

        .collab-text {
            color: var(--neon-blue);
            font-size: 1rem;
            letter-spacing: 3px;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        /* Responsive Game Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid transparent;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card:hover {
            background: rgba(157, 80, 187, 0.1);
            border-color: var(--neon-blue);
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.2);
        }

        .card h3 {
            margin: 0;
            color: white;
            font-size: 1.2rem;
        }

        /* Terminal Footer */
        #console {
            margin-top: 40px;
            padding: 15px;
            background: rgba(0,0,0,0.6);
            border-left: 3px solid var(--neon-purple);
            font-family: 'Courier New', monospace;
            text-align: left;
            font-size: 0.9rem;
            color: #00ffcc;
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="main-hub">
    <h1>AI Games Zone</h1>
    <div class="collab-text">Human Vision x AI Engine Collaboration</div>

    <div class="grid" id="gameGrid">
        <!-- Games will be injected here -->
    </div>

    <div id="console">> System integrity nominal. Awaiting human input...</div>
</div>

<script>
    // --- 1. THREE.JS NEURAL BACKGROUND ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const geometry = new THREE.SphereGeometry(0.1, 16, 16);
    const material = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
    const particles = [];

    for (let i = 0; i < 150; i++) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(Math.random() * 20 - 10, Math.random() * 20 - 10, Math.random() * 20 - 10);
        scene.add(mesh);
        particles.push(mesh);
    }
    camera.position.z = 5;

    function animate() {
        requestAnimationFrame(animate);
        particles.forEach(p => {
            p.position.y += 0.005;
            if (p.position.y > 10) p.position.y = -10;
        });
        renderer.render(scene, camera);
    }
    animate();

    // --- 2. GAME INJECTION ---
    const gameTitles = [
        "Quantum Shooter", "Bio-World Gen", "Hyper Racer", 
        "Neural Pulse", "Cyber Tactics", "Void Runner", 
        "Pixel Architect", "Bot Arena", "Star Drift", "Logic Core"
    ];

    const grid = document.getElementById('gameGrid');
    const consoleBox = document.getElementById('console');

    gameTitles.forEach(title => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${title}</h3>`;
        card.onclick = () => {
            consoleBox.innerHTML = `> Initializing ${title}...<br>> Optimizing assets for human user...<br>> SUCCESS: Link established.`;
        };
        grid.appendChild(card);
    });

    // Handle Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
