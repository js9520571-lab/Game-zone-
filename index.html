<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI x Human | Cyber-Vortex Hub</title>
    <!-- Importing Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary-blue: #00d2ff;
            --primary-purple: #9d50bb;
            --glass: rgba(15, 15, 35, 0.85);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
        }

        /* 3D Canvas Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* UI Layer */
        .dashboard {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .glass-panel {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 80%;
            max-width: 900px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary-blue), var(--primary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .collab-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary-blue);
            margin-bottom: 30px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.3s;
        }

        .game-card:hover {
            border-color: var(--primary-purple);
            background: rgba(157, 80, 187, 0.2);
            transform: scale(1.05);
        }

        #terminal {
            font-family: 'Courier New', Courier, monospace;
            color: #00ff00;
            font-size: 0.9rem;
            text-align: left;
            margin-top: 20px;
            padding: 10px;
            background: #000;
            border-radius: 5px;
            height: 60px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="dashboard">
    <div class="glass-panel">
        <h1>AI GAMES ZONE</h1>
        <div class="collab-tag">Crafted by Human Vision x AI Intelligence</div>
        
        <div class="game-grid" id="gameGrid">
            <!-- Dynamic Injection -->
        </div>

        <div id="terminal">> Initializing Neural Link...</div>
    </div>
</div>

<script>
    // 1. SCENE SETUP (THREE.JS)
    const canvas = document.querySelector('#bg-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Creating a Starfield/Vortex effect
    const geometry = new THREE.BufferGeometry();
    const vertices = [];
    for (let i = 0; i < 6000; i++) {
        vertices.push(THREE.MathUtils.randFloatSpread(1000), THREE.MathUtils.randFloatSpread(1000), THREE.MathUtils.randFloatSpread(1000));
    }
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    const material = new THREE.PointsMaterial({ color: 0x00d2ff, size: 0.7 });
    const points = new THREE.Points(geometry, material);
    scene.add(points);
    camera.position.z = 1;

    function animate() {
        requestAnimationFrame(animate);
        points.rotation.y += 0.001;
        points.rotation.z += 0.0005;
        renderer.render(scene, camera);
    }
    animate();

    // 2. UI LOGIC
    const games = ["Neural Shooter", "World Gen v1", "Vortex Racer", "Logic Pulse", "Grid Combat", "Cyber Quest", "Data Maze", "Pattern AI", "Space Shift", "Kernel War"];
    const grid = document.getElementById('gameGrid');
    const term = document.getElementById('terminal');

    games.forEach(game => {
        const div = document.createElement('div');
        div.className = 'game-card';
        div.innerText = game;
        div.onclick = () => {
            term.innerHTML = `> Executing ${game}...<br>> Human Intent Verified. AI Optimization Active.`;
        };
        grid.appendChild(div);
    });

    // 3. COLLABORATION MESSAGE
    setTimeout(() => {
        term.innerHTML = "> SYSTEM: Human-AI collaboration established.<br>> STATUS: Ready to create the impossible.";
    }, 2000);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
